<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">VEGENETICA</title>
  <desc id="desc">野菜を育てて交配し、野菜選手権を目指すゲーム。金色の野菜と実際の農園画面。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#91cad0"/>
      <stop offset="1" stop-color="#e9e8c6"/>
    </linearGradient>
    <linearGradient id="frame" x2="0" y2="1">
      <stop stop-color="#faffef"/>
      <stop offset="1" stop-color="#d5e6c5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#315648" flood-opacity=".22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#243c30" flood-opacity=".32"/>
    </filter>
    <clipPath id="gameplayClip">
      <rect x="465" y="130" width="690" height="431" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="265" cy="173" r="60" fill="#fff0b8" opacity=".92"/>
  <circle cx="265" cy="173" r="77" fill="none" stroke="#fff4d3" stroke-width="11" opacity=".34"/>
  <path d="M0 337 Q147 246 309 323 T621 305 T930 312 T1200 279 V640 H0Z" fill="#9daE82"/>
  <path d="M0 383 Q186 303 352 376 T670 356 T996 367 T1200 338 V640 H0Z" fill="#748d65"/>
  <path d="M0 444 Q160 356 319 433 T651 412 T954 424 T1200 394 V640 H0Z" fill="#52755b"/>
  <path d="M0 502 Q214 418 402 477 T760 469 T1088 453 T1200 463 V640 H0Z" fill="#88a36d"/>
  <path d="M-30 577 Q208 493 404 553 T798 538 T1235 522" fill="none" stroke="#ced099" stroke-width="30" opacity=".75"/>
  <path d="M-30 578 Q208 494 404 554 T798 539 T1235 523" fill="none" stroke="#f1e7b4" stroke-width="10" opacity=".8"/>

  <g fill="#42664d" opacity=".74">
    <path d="M69 431c0-45 34-69 68-66-9 26-29 49-68 66Zm8 2c22-39 60-47 83-34-19 23-47 37-83 34Zm-1 1c-11-40 7-71 31-80 8 29 2 58-31 80Z"/>
    <path d="M1111 415c0-42 31-64 62-61-8 24-26 45-62 61Zm7 2c20-36 55-43 76-31-18 21-43 33-76 31Zm-1 1c-10-37 6-66 29-74 7 27 2 54-29 74Z"/>
  </g>
  <g fill="#fff4c7" opacity=".92">
    <circle cx="107" cy="534" r="7"/><circle cx="124" cy="526" r="7"/><circle cx="117" cy="543" r="7"/><circle cx="117" cy="535" r="4" fill="#e7a64b"/>
    <circle cx="1090" cy="494" r="7"/><circle cx="1107" cy="486" r="7"/><circle cx="1100" cy="503" r="7"/><circle cx="1100" cy="495" r="4" fill="#e7a64b"/>
    <circle cx="370" cy="540" r="6"/><circle cx="385" cy="534" r="6"/><circle cx="379" cy="549" r="6"/><circle cx="379" cy="541" r="3" fill="#e7a64b"/>
  </g>

  <g font-family="'Trebuchet MS', 'Yu Gothic', sans-serif" fill="#254d42">
    <text x="46" y="60" font-size="27" font-weight="700" letter-spacing="2">VEGENETICA</text>
    <text x="48" y="86" font-size="16" letter-spacing="2" opacity=".76">畑から世界へ。</text>
  </g>

  <g filter="url(#softShadow)">
    <image x="-39" y="88" width="640" height="427" preserveAspectRatio="xMidYMid meet" href="vegenetica-mascot.png" xlink:href="vegenetica-mascot.png"/>
  </g>

  <rect x="445" y="108" width="730" height="465" rx="28" fill="url(#frame)" stroke="#fafff0" stroke-width="9" filter="url(#shadow)"/>
  <rect x="453" y="116" width="714" height="449" rx="22" fill="none" stroke="#83b790" stroke-width="3" opacity=".9"/>
  <image x="465" y="130" width="690" height="431" preserveAspectRatio="xMidYMid slice" clip-path="url(#gameplayClip)" href="vegenetica-gameplay.png" xlink:href="vegenetica-gameplay.png"/>

  <rect x="40" y="597" width="1120" height="162" rx="28" fill="#fffdf5" stroke="#e1e3cf" stroke-width="3" filter="url(#shadow)"/>
  <path d="M95 734 Q390 749 677 734" fill="none" stroke="#a8d2ac" stroke-width="8" stroke-linecap="round"/>
  <text x="563" y="684" text-anchor="middle" font-family="'Yu Gothic', 'Noto Sans JP', sans-serif" font-size="45" font-weight="700" letter-spacing="2" fill="#1f3850">そだてて、交配して、世界一！</text>
  <rect x="900" y="705" width="223" height="40" rx="20" fill="#83d0ad" stroke="#e8fff3" stroke-width="5"/>
  <text x="1012" y="732" text-anchor="middle" font-family="'Trebuchet MS', 'Yu Gothic', sans-serif" font-size="21" font-weight="700" letter-spacing="1.5" fill="#174844">VEGENETICA</text>
  <g fill="#fffdf5" stroke="#80b88b" stroke-width="5">
    <path d="m1081 582 14-20 14 20v17h-28Z"/>
    <path d="m1045 582 13-18 13 18v17h-26Z"/>
  </g>
</svg>
